<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Student Form</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 th:text="${title}"></h2>

    <form th:action="@{/save}" th:object="${student}" method="post">

        <div class="mb-3">

            <label>Name</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{name}">
        </div>

        <div class="mb-3">

            <label>Course</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{course}">
        </div>

        <div class="mb-3">

            <label>Age</label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{age}">
        </div>

        <button class="btn btn-primary">
            Save Student
        </button>
        <a href="/students" class="btn btn-light">
            Student List
        </a>

    </form>

</div>

</body>
</html>
